<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>망곰이 지구 탐험</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Pretendard', sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(15, 15, 25, 0.75);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        #ui-overlay h1 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #ffe066;
        }
        #ui-overlay p {
            font-size: 13px;
            line-height: 1.5;
            color: #dddddd;
        }
    </style>
    <!-- Three.js 및 카메라 컨트롤 외부 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h1>🐻 망곰이 지구 탐험</h1>
        <p>• <b>방향키 / WASD</b>: 망곰이 이동</p>
        <p>• <b>마우스 드래그</b>: 카메라 회전</p>
        <p>• <b>휠 스크롤</b>: 카메라 확대/축소</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 1. 기본 Scene, Camera, Renderer 구성
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050512);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 2. 카메라 오비트 컨트롤 (카메라 작동 및 조작 해결)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 25;
        controls.minDistance = 5;

        // 3. 조명 (태양광 및 환경광)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 15, 10);
        scene.add(dirLight);

        // 4. 지구 (Earth) 생성
        const earthRadius = 3.5;
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // 바다 (구체)
        const oceanGeo = new THREE.SphereGeometry(earthRadius, 64, 64);
        const oceanMat = new THREE.MeshStandardMaterial({
            color: 0x1d4ed8,
            roughness: 0.4,
            metalness: 0.1
        });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        earthGroup.add(ocean);

        // 대륙 블록 표현
        const landGroup = new THREE.Group();
        const landMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.8 });
        for (let i = 0; i < 40; i++) {
            const landPart = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.8), landMat);
            const lat = (Math.random() - 0.5) * Math.PI;
            const lon = Math.random() * Math.PI * 2;
            const r = earthRadius + 0.02;
            
            landPart.position.set(
                r * Math.cos(lat) * Math.sin(lon),
                r * Math.sin(lat),
                r * Math.cos(lat) * Math.cos(lon)
            );
            landPart.lookAt(0, 0, 0);
            landGroup.add(landPart);
        }
        earthGroup.add(landGroup);

        // 5. 망곰이 (Manggom) 캐릭터 모델링 (그룹 형태)
        const manggom = new THREE.Group();

        // 몸통
        const bodyGeo = new THREE.SphereGeometry(0.45, 32, 32);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xfffbeb }); // 옅은 아이보리
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.scale.set(1, 0.95, 0.9);
        manggom.add(body);

        // 귀
        const earGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const earMat = new THREE.MeshStandardMaterial({ color: 0x78350f }); // 망곰이 귀 색상
        const leftEar = new THREE.Mesh(earGeo, earMat);
        leftEar.position.set(-0.3, 0.35, 0);
        const rightEar = new THREE.Mesh(earGeo, earMat);
        rightEar.position.set(0.3, 0.35, 0);
        manggom.add(leftEar, rightEar);

        // 눈
        const eyeGeo = new THREE.SphereGeometry(0.05, 16, 16);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.15, 0.1, 0.4);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.15, 0.1, 0.4);
        manggom.add(leftEye, rightEye);

        scene.add(manggom);

        // 망곰이 위치 제어 변수 (경도, 위도)
        let playerLon = 0;
        let playerLat = 0;

        function updateManggomPosition() {
            const height = earthRadius + 0.4;
            manggom.position.x = height * Math.cos(playerLat) * Math.sin(playerLon);
            manggom.position.y = height * Math.sin(playerLat);
            manggom.position.z = height * Math.cos(playerLat) * Math.cos(playerLon);

            // 망곰이가 지구 중심을 향해 서 있도록 방향 설정
            manggom.lookAt(manggom.position.clone().multiplyScalar(2));
        }
        updateManggomPosition();

        // 6. 키보드 컨트롤 처리
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // 7. 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);

            // 지구 자전
            earthGroup.rotation.y += 0.0015;

            // 이동 처리
            const moveSpeed = 0.025;
            if (keys['arrowleft'] || keys['a']) playerLon -= moveSpeed;
            if (keys['arrowright'] || keys['d']) playerLon += moveSpeed;
            if (keys['arrowup'] || keys['w']) playerLat = Math.min(playerLat + moveSpeed, Math.PI / 2.3);
            if (keys['arrowdown'] || keys['s']) playerLat = Math.max(playerLat - moveSpeed, -Math.PI / 2.3);

            updateManggomPosition();

            // 카메라 제어 상태 갱신
            controls.update();

            // 렌더링
            renderer.render(scene, camera);
        }

        // 8. 브라우저 리사이즈 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
