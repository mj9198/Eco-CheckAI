<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eco-Check AI | 페트병·캔 올바른 분리배출 상태 판별기</title>

  <!-- TensorFlow.js 공식 CDN -->

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

  <!-- Teachable Machine Image 공식 라이브러리 -->

  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    /* =========================================================
       ECO-CHECK AI
       전체적인 디자인
       ========================================================= */

    :root {
      --sky: #dff5ff;
      --sky2: #bdeaff;
      --blue: #2478d7;
      --blue-dark: #1254a0;
      --blue-deep: #073b78;

      --navy: #112d4d;
      --text: #24445f;
      --muted: #638099;

      --white: #ffffff;

      --green: #1ca86b;
      --green-light: #e4f8ee;

      --yellow: #d99a18;
      --yellow-light: #fff6dc;

      --red: #dc5555;
      --red-light: #fff0f0;

      --shadow:
        0 14px 35px rgba(31, 109, 164, 0.15);

      --shadow-blue:
        0 16px 38px rgba(36, 120, 215, 0.22);
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 5%,
          #ffffff 0,
          rgba(255,255,255,0.7) 12%,
          transparent 28%
        ),
        linear-gradient(
          180deg,
          #ccefff 0%,
          #effbff 45%,
          #ccefff 100%
        );

      /*
        사진 속 글씨처럼 굵고 손으로 쓴 듯한 느낌을
        최대한 표현하기 위한 글꼴 조합입니다.

        별도의 외부 폰트 파일 없이 작동합니다.
      */
      font-family:
        "Arial Black",
        "Malgun Gothic",
        "Apple SD Gothic Neo",
        "Trebuchet MS",
        sans-serif;

      line-height: 1.55;
    }


    button,
    input {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    /* =========================================================
       페이지
       ========================================================= */

    .page {
      width: min(100% - 24px, 980px);

      margin: 0 auto;

      padding:
        25px 0 60px;
    }


    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 30px;

      min-height: 310px;

      padding: 25px 10px 35px;
    }


    .hero-text {
      flex: 1;

      min-width: 0;
    }


    .eyebrow {
      display: inline-block;

      margin-bottom: 14px;

      padding:
        7px 15px;

      border-radius: 999px;

      background: var(--blue);

      color: white;

      font-size: 0.78rem;

      font-weight: 900;

      letter-spacing: -0.02em;

      box-shadow:
        0 7px 15px rgba(36, 120, 215, 0.2);
    }


    /*
      제목은 참고 이미지의 굵고 강한 글씨 느낌을 강조합니다.
    */
    h1 {
      margin: 0;

      color: var(--blue-deep);

      font-size:
        clamp(2.7rem, 10vw, 5.5rem);

      line-height: 0.95;

      letter-spacing: -0.08em;

      font-weight: 1000;

      /*
        글자가 약간 포스터처럼 보이도록 그림자를 사용합니다.
      */
      text-shadow:
        3px 3px 0 rgba(255,255,255,0.9),
        5px 5px 0 rgba(36,120,215,0.12);
    }


    .hero-description {
      max-width: 620px;

      margin: 20px 0 0;

      color: var(--navy);

      font-size:
        clamp(0.95rem, 2vw, 1.12rem);

      font-weight: 900;

      letter-spacing: -0.04em;
    }


    /* =========================================================
       캐릭터
       ========================================================= */

    .hero-image-wrap {
      position: relative;

      flex: 0 0 225px;

      width: 225px;
      height: 225px;

      padding: 8px;

      background: white;

      border:
        5px solid var(--blue);

      border-radius: 50%;

      box-shadow: var(--shadow-blue);

      transform: rotate(3deg);
    }


    .hero-image {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 50%;
    }


    /* =========================================================
       공통 텍스트
       ========================================================= */

    .section-title {
      margin: 0 0 9px;

      color: var(--blue-deep);

      font-size: 1.35rem;

      font-weight: 1000;

      letter-spacing: -0.05em;
    }


    .sub-info {
      color: var(--muted);

      font-size: 0.93rem;

      font-weight: 800;

      letter-spacing: -0.035em;
    }


    /* =========================================================
       1. 문제 소개 - 지구 모양
       ========================================================= */

    .earth-section {
      position: relative;

      width: min(100%, 720px);

      margin: 0 auto 30px;

      padding: 72px 85px;

      /*
        완전한 원형 대신 약간 불규칙하게 만들어
        일러스트 같은 느낌을 줍니다.
      */
      border-radius:
        48% 52% 55% 45%
        / 50% 47% 53% 50%;

      background:
        radial-gradient(
          circle at 32% 28%,
          #6dd7ff 0%,
          #37b9ec 32%,
          #1687ca 70%,
          #0e6bab 100%
        );

      border:
        8px solid white;

      box-shadow:
        var(--shadow-blue);

      color: white;

      overflow: hidden;
    }


    /*
      지구의 대륙처럼 보이는 장식
    */
    .earth-section::before,
    .earth-section::after {
      content: "";

      position: absolute;

      background: rgba(90, 214, 130, 0.78);

      border-radius:
        45% 55% 40% 60%;
    }


    .earth-section::before {
      width: 130px;
      height: 75px;

      top: 25px;
      left: 55px;

      transform: rotate(-18deg);
    }


    .earth-section::after {
      width: 150px;
      height: 95px;

      right: 45px;
      bottom: 30px;

      transform: rotate(14deg);
    }


    .earth-content {
      position: relative;

      z-index: 2;

      text-align: center;
    }


    .earth-section .section-title {
      color: white;

      font-size:
        clamp(1.3rem, 5vw, 1.7rem);

      text-shadow:
        2px 2px 0 rgba(0,0,0,0.12);
    }


    .earth-section .sub-info {
      color: #f2fbff;
    }


    .problem-points {
      position: relative;

      z-index: 2;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

      margin-top: 18px;
    }


    .problem-point {
      padding: 13px;

      background:
        rgba(255,255,255,0.18);

      border:
        2px solid rgba(255,255,255,0.4);

      border-radius: 20px;

      color: white;

      font-size: 0.83rem;

      font-weight: 900;

      backdrop-filter: blur(3px);
    }


    /* =========================================================
       AI 체험 영역
       페트병 실루엣
       ========================================================= */

    .bottle-section {
      position: relative;

      margin: 20px auto 35px;

      width: min(100%, 760px);

      padding:
        75px 34px 40px;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #eaf8ff
        );

      /*
        페트병처럼 위쪽이 좁고
        가운데가 넓어지는 느낌을 만듭니다.
      */
      border-radius:
        48px 48px 42px 42px /
        90px 90px 45px 45px;

      border:
        4px solid #77caff;

      box-shadow:
        var(--shadow-blue);

      overflow: hidden;
    }


    /*
      페트병 입구
    */
    .bottle-section::before {
      content: "";

      position: absolute;

      top: -30px;
      left: 50%;

      width: 88px;
      height: 85px;

      transform:
        translateX(-50%);

      border-radius:
        20px 20px 12px 12px;

      background:
        linear-gradient(
          90deg,
          #b9eaff,
          #ffffff,
          #a8e4ff
        );

      border:
        4px solid #77caff;

      box-shadow:
        inset 0 -13px 0 rgba(36,120,215,0.08);
    }


    /*
      병의 가운데 하이라이트
    */
    .bottle-section::after {
      content: "";

      position: absolute;

      top: 90px;
      left: 25px;

      width: 13px;
      height: 220px;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.7);

      transform: rotate(3deg);
    }


    .bottle-content {
      position: relative;

      z-index: 3;
    }


    .experience-header {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 20px;
    }


    .experience-title {
      margin: 0;

      color: var(--blue-deep);

      font-size:
        clamp(1.7rem, 7vw, 2.5rem);

      line-height: 1;

      letter-spacing: -0.07em;

      font-weight: 1000;
    }


    .model-status {
      flex: 0 0 auto;

      min-width: 110px;

      padding: 8px 12px;

      border-radius: 999px;

      background: #e9f1f6;

      color: var(--muted);

      font-size: 0.73rem;

      font-weight: 900;

      text-align: center;
    }


    .model-status.ready {
      background: var(--green-light);

      color: #16724a;
    }


    .model-status.error {
      background: var(--red-light);

      color: var(--red);
    }


    .model-status.loading {
      background: var(--yellow-light);

      color: #91640d;
    }


    /* =========================================================
       입력 방법
       ========================================================= */

    .method-title {
      margin: 0 0 10px;

      color: var(--blue-dark);

      font-size: 0.95rem;

      font-weight: 1000;
    }


    .method-buttons {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }


    .method-button {
      min-height: 58px;

      padding: 12px;

      border:
        3px solid #bde2f5;

      border-radius: 20px;

      background: white;

      color: var(--text);

      font-weight: 1000;

      letter-spacing: -0.04em;

      transition:
        0.15s ease;
    }


    .me
